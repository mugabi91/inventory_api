[project]
name = "inventory-api"
version = "0.1.0"
description = "A simple, FastAPI-based Inventory and Sales Tracking API for small retail shops. Features user authentication, product stock management, sales recording, and basic reporting endpoints. Built with FastAPI, SQLModel, and JWT auth."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.11.4",
    "pyodbc>=5.2.0",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.4.0",
    "sqlalchemy>=2.0.40",
    "uvicorn>=0.34.2",
]
